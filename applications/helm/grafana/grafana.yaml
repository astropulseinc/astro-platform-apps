# Grafana, from its Helm chart
#
# The admin password is generated into the Secret `grafana` in the
# `monitoring` namespace:
#   kubectl -n monitoring get secret grafana -o jsonpath='{.data.admin-password}' | base64 -d
#
# The volume uses the cluster's default StorageClass; set
# persistence.storageClassName if the cluster has none.
#
# Apply: astroctl app apply -f grafana.yaml
# Chart values: https://github.com/grafana-community/helm-charts/tree/main/charts/grafana
apiVersion: platform.astropulse.io/v1
kind: Application
spec:
  name: grafana
  profileName: <YOUR_PROFILE_NAME>
  namespace: monitoring
  source:
    type: Helm
    helm:
      repo:
        repoURL: https://grafana-community.github.io/helm-charts
        chartName: grafana
        chartVersion: 14.4.0
      values:
        object:
          persistence:
            enabled: true
            size: 10Gi
          plugins:
            - grafana-clickhouse-datasource

# Confluent for Kubernetes (CFK) operator, from its Helm chart
#
# Watches every namespace for Confluent resources. kafka.yaml deploys a
# ZooKeeper ensemble, a Kafka cluster and a topic.
#
# Apply: astroctl app apply -f confluent-operator.yaml
# Docs:  https://docs.confluent.io/operator/current/co-deploy-cfk.html
apiVersion: platform.astropulse.io/v1
kind: Application
spec:
  name: confluent-operator
  profileName: <YOUR_PROFILE_NAME>
  namespace: confluent
  source:
    type: Helm
    helm:
      repo:
        repoURL: https://packages.confluent.io/helm
        chartName: confluent-for-kubernetes
        chartVersion: 0.921.20
      values:
        object:
          namespaced: false

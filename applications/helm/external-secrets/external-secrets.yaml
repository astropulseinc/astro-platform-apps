# External Secrets Operator, from its Helm chart
#
# Syncs secrets from AWS Secrets Manager, Google Secret Manager, Azure Key
# Vault and others into Kubernetes Secrets.
#
# Apply: astroctl app apply -f external-secrets.yaml
# Chart values: https://github.com/external-secrets/external-secrets/tree/main/deploy/charts/external-secrets
apiVersion: platform.astropulse.io/v1
kind: Application
spec:
  name: external-secrets
  profileName: <YOUR_PROFILE_NAME>
  namespace: external-secrets
  source:
    type: Helm
    helm:
      repo:
        repoURL: https://charts.external-secrets.io
        chartName: external-secrets
        chartVersion: 0.10.4
      values:
        object:
          installCRDs: true

# DNS Automation (external-dns): publishes DNS records for your applications'
# hostnames.
#
# It writes to your DNS zone as a cloud workload identity (`identity`) or,
# where one cannot be used, with credentials from a Secret in the
# `external-dns` namespace (`secretRef`). On an EKS cluster AstroPulse
# created, `identity` defaults to the cluster's own external-dns role.
#
# Apply: astroctl infra k8s addons apply -f external-dns.yaml
apiVersion: platform.astropulse.io/v1
kind: K8sClusterAddon
metadata:
  name: external-dns
spec:
  clusterName: <YOUR_CLUSTER_NAME>
  configuration:
    externalDns:
      provider: aws                 # aws, gcp or azure; defaults to the cluster's cloud
      domainFilter: example.com     # the zone it may write to
      policy: Sync                  # Sync, or UpsertOnly to never delete records
      gatewayRoutes: false          # true publishes model endpoints too; needs the gateway add-on
      identity:
        awsRoleArn: arn:aws:iam::<YOUR_AWS_ACCOUNT_ID>:role/<YOUR_EXTERNAL_DNS_ROLE>
      # Instead of identity:
      # secretRef: external-dns-credentials
  options:
    waitForReady: true
    timeout: 10m

# Workload Autoscaling (KEDA): scales applications on demand, and model
# replicas on the requests waiting for them.
#
# Model scaling on queue depth reads the model's metrics from a Prometheus.
# The endpoint below is the one the cost-visibility add-on installs; point it
# at your own Prometheus if you run one. Without a metrics source, models
# scale on CPU instead.
#
# Apply: astroctl infra k8s addons apply -f workload-autoscaling.yaml
apiVersion: platform.astropulse.io/v1
kind: K8sClusterAddon
metadata:
  name: workload-autoscaling
spec:
  clusterName: <YOUR_CLUSTER_NAME>
  configuration:
    workloadAutoscaling:
      metricsSource:
        prometheus:
          endpoint: http://cost-visibility-prometheus-server.astro-cost.svc.cluster.local:80
  options:
    waitForReady: true
    timeout: 10m

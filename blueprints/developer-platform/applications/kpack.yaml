# Reads the unmodified kpack release from this repository, so it needs no copy of its own.
apiVersion: platform.astropulse.io/v1
kind: Application
spec:
  name: kpack
  profileName: platform
  namespace: kpack
  source:
    type: YAML
    yaml:
      repo:
        repoURL: https://github.com/astropulseinc/astro-platform-apps.git
        targetRevision: main
        path: blueprints/developer-platform/resources/kpack-release

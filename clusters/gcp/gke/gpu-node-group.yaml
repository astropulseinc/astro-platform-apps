# GKE Standard cluster with a GPU node group
#
# A platform node group for the cluster's own components and a GPU node group
# for models.
#
# Before you apply:
#   1. GPU quota above zero in the region: list what you can run with
#        astroctl cloud gcp accelerators list -r <YOUR_REGION>
#   2. Connect the project:
#        astroctl cloud gcp connect --project-id <YOUR_GCP_PROJECT_ID> --cluster-name <YOUR_CLUSTER_NAME> --region <YOUR_REGION>
#
# Apply: astroctl infra k8s apply -f gpu-node-group.yaml --dry-run, then without --dry-run
apiVersion: platform.astropulse.io/v1
kind: K8sCluster
spec:
  clusterName: <YOUR_CLUSTER_NAME>
  provider: gcp
  region: <YOUR_REGION>
  provisioner:
    type: gke
    gke:
      projectId: "<YOUR_GCP_PROJECT_ID>"
      releaseChannel: Rapid
      kubernetesVersion: "1.36"         # GPU node groups need 1.36 or later
      credentials:
        type: Dynamic
  clusterSpec:
    dataPlane:
      nodeGroups:
        - name: platform
          minNode: 1
          maxNode: 3
          instanceType: OnDemand
          machineTypes:
            - e2-standard-4
        - name: gpu
          minNode: 0
          maxNode: 2
          instanceType: OnDemand
          machineTypes:
            - g2-standard-8            # one NVIDIA L4
          accelerator:
            gpu:
              model: l4
              countPerNode: 1

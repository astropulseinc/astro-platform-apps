# GKE Standard cluster in a new VPC
#
# Before you apply:
#   1. Find your project ID:  gcloud config get-value project
#   2. Enable the GKE API once per project:
#        gcloud services enable container.googleapis.com --project <YOUR_GCP_PROJECT_ID>
#   3. Connect the project:
#        astroctl cloud gcp connect --project-id <YOUR_GCP_PROJECT_ID> --cluster-name <YOUR_CLUSTER_NAME> --region <YOUR_REGION>
#
# Apply: astroctl infra k8s apply -f new-vpc.yaml --dry-run, then without --dry-run
# Docs:  https://astropulse.io/docs/latest/platform/cluster-pipeline/provisioner/managed/gke
apiVersion: platform.astropulse.io/v1
kind: K8sCluster
spec:
  clusterName: <YOUR_CLUSTER_NAME>
  provider: gcp
  region: <YOUR_REGION>                # the region you connected, such as us-central1
  provisioner:
    type: gke
    gke:
      projectId: "<YOUR_GCP_PROJECT_ID>"
      releaseChannel: Stable           # Stable, Regular or Rapid
      # kubernetesVersion: "1.34"      # omit for the channel's default
      credentials:
        type: Dynamic
  clusterSpec:
    dataPlane:
      nodeGroups:
        - name: default-pool
          minNode: 1
          maxNode: 5
          instanceType: OnDemand       # OnDemand or Spot
          machineTypes:
            - e2-standard-2
          labels:
            environment: dev

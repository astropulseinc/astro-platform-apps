# Reads the reports the Vulnerability Scanning add-on writes for each workload.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: check-vulnerabilities
  annotations:
    policies.kyverno.io/title: No critical vulnerabilities
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: no-critical-findings
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [latency-app]
      context:
        - name: criticals
          apiCall:
            urlPath: "/apis/aquasecurity.github.io/v1alpha1/namespaces/{{request.namespace}}/vulnerabilityreports"
            jmesPath: "sum(items[].report.summary.criticalCount) || `0`"
      validate:
        message: "An image in this namespace has CRITICAL vulnerabilities."
        deny:
          conditions:
            all:
              - key: "{{ criticals }}"
                operator: GreaterThan
                value: 0
---
# Lets Kyverno read the scan reports.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-read-vulnerability-reports
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: [aquasecurity.github.io]
    resources: [vulnerabilityreports]
    verbs: [get, list, watch]

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow the latest tag
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: pinned-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [latency-app]
      validate:
        message: "Use a fixed image tag, not latest."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
